rules:
  # ── AI/LLM Security (JavaScript) ──────────────────────────────────────
  - id: canop.js-ai.openai-hardcoded-key
    pattern-regex: 'apiKey\s*:\s*[''"]sk-[A-Za-z0-9]{20,}[''"]'
    message: >
      OpenAI API key hardcoded — enables unauthorized API usage and billing.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      canop_severity: CRITICAL
      confidence: HIGH
      category: secrets
      cwe: "CWE-798"
      fix: "Use process.env.OPENAI_API_KEY"

  - id: canop.js-ai.eval-llm-output
    pattern: |
      eval($RESPONSE. ...)
    message: >
      Evaluating LLM response — LLM output is untrusted and can contain
      injected malicious code.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      canop_severity: CRITICAL
      confidence: MEDIUM
      category: injection
      cwe: "CWE-95"
      fix: "Parse LLM output as data (JSON.parse); never execute it"

  - id: canop.js-ai.function-constructor-llm
    pattern: |
      new Function($RESPONSE. ...)
    message: >
      Function constructor with LLM output — arbitrary code execution.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      canop_severity: CRITICAL
      confidence: MEDIUM
      category: injection
      cwe: "CWE-95"
      fix: "Parse LLM output as structured data; never compile as code"

  - id: canop.js-ai.exec-llm-output
    pattern: |
      exec($RESPONSE. ..., ...)
    message: >
      System command execution with LLM output — OS command injection.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      canop_severity: CRITICAL
      confidence: MEDIUM
      category: injection
      cwe: "CWE-78"
      fix: "Never pass LLM output to command execution"

  - id: canop.js-ai.langchain-shell-tool
    pattern-regex: 'new ShellTool|ShellTool\(\)|tools.*ShellTool'
    message: >
      LangChain ShellTool — allows LLM to execute system commands.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      canop_severity: CRITICAL
      confidence: HIGH
      category: injection
      cwe: "CWE-78"
      fix: "Remove ShellTool; use specific, restricted tools instead"

  - id: canop.js-ai.langchain-dynamic-tool-exec
    pattern-regex: 'new DynamicTool\s*\(\s*\{[^}]*(?:exec|eval|spawn|Function)'
    message: >
      LangChain DynamicTool with code execution — unsafe tool implementation.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      canop_severity: CRITICAL
      confidence: MEDIUM
      category: injection
      cwe: "CWE-78"
      fix: "Implement tools that only perform specific, validated operations"

  - id: canop.js-ai.prompt-injection-template
    pattern-regex: '(?:content|prompt|message)\s*:\s*`[^`]*\$\{(?:req|request|user|input|body|query|params)'
    message: >
      User input interpolated directly into LLM prompt — prompt injection risk.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      canop_severity: HIGH
      confidence: MEDIUM
      category: injection
      cwe: "CWE-74"
      fix: "Sanitize user input; use system prompts with clear boundaries"

  - id: canop.js-ai.anthropic-hardcoded-key
    pattern-regex: 'apiKey\s*:\s*[''"]sk-ant-[A-Za-z0-9-]+[''"]'
    message: >
      Anthropic API key hardcoded in source code.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      canop_severity: CRITICAL
      confidence: HIGH
      category: secrets
      cwe: "CWE-798"
      fix: "Use process.env.ANTHROPIC_API_KEY"

  - id: canop.js-ai.llm-output-innerhtml
    pattern-regex: '\.innerHTML\s*=.*(?:completion|response|message\.content|choices\[|answer|generated|output)'
    message: >
      LLM output rendered as HTML — XSS via injected HTML in LLM response.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      canop_severity: HIGH
      confidence: MEDIUM
      category: xss
      cwe: "CWE-79"
      fix: "Use textContent or sanitize with DOMPurify before rendering"

  - id: canop.js-ai.sql-from-llm
    pattern-regex: '(?:query|execute|run)\s*\(\s*(?:completion|response|generated|llmOutput|aiResponse)'
    message: >
      SQL query generated by LLM — SQL injection if LLM output is not validated.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      canop_severity: CRITICAL
      confidence: MEDIUM
      category: injection
      cwe: "CWE-89"
      fix: "Validate and parameterize LLM-generated SQL; use allowlisted query patterns"
