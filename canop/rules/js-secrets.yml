rules:
  # ── Hardcoded API Keys & Secrets ───────────────────────────────────────
  - id: canop.js-secrets.aws-access-key
    pattern-regex: '(?:AKIA|ASIA)[A-Z0-9]{16}'
    message: >
      AWS Access Key ID detected. Never commit AWS credentials to code.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      canop_severity: CRITICAL
      confidence: HIGH
      category: secrets
      cwe: "CWE-798"
      fix: "Use environment variables: process.env.AWS_ACCESS_KEY_ID"

  - id: canop.js-secrets.aws-secret-key
    pattern-regex: '[''"][A-Za-z0-9/+=]{40}[''"]'
    message: >
      Potential AWS Secret Access Key detected. Verify and remove if credentials.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      canop_severity: HIGH
      confidence: LOW
      category: secrets
      cwe: "CWE-798"
      fix: "Move to environment variables or AWS Secrets Manager"

  - id: canop.js-secrets.github-token
    pattern-regex: '(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9_]{36,255}'
    message: >
      GitHub personal access token detected in code.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      canop_severity: CRITICAL
      confidence: HIGH
      category: secrets
      cwe: "CWE-798"
      fix: "Use process.env.GITHUB_TOKEN"

  - id: canop.js-secrets.stripe-secret-key
    pattern-regex: 'sk_(?:live|test)_[A-Za-z0-9]{20,}'
    message: >
      Stripe secret key detected. Compromised keys enable unauthorized charges.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      canop_severity: CRITICAL
      confidence: HIGH
      category: secrets
      cwe: "CWE-798"
      fix: "Use process.env.STRIPE_SECRET_KEY"

  - id: canop.js-secrets.stripe-restricted-key
    pattern-regex: 'rk_(?:live|test)_[A-Za-z0-9]{20,}'
    message: >
      Stripe restricted key detected in code.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      canop_severity: HIGH
      confidence: HIGH
      category: secrets
      cwe: "CWE-798"
      fix: "Use environment variable for Stripe keys"

  - id: canop.js-secrets.google-api-key
    pattern-regex: 'AIza[A-Za-z0-9_\\-]{35}'
    message: >
      Google API key detected. May enable unauthorized API usage.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      canop_severity: HIGH
      confidence: HIGH
      category: secrets
      cwe: "CWE-798"
      fix: "Use process.env.GOOGLE_API_KEY and restrict key in Google Cloud Console"

  - id: canop.js-secrets.slack-token
    pattern-regex: 'xox[bpors]-[A-Za-z0-9-]{10,}'
    message: >
      Slack token detected. Enables access to workspace messages and data.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      canop_severity: CRITICAL
      confidence: HIGH
      category: secrets
      cwe: "CWE-798"
      fix: "Store in environment variable; rotate immediately if committed"

  - id: canop.js-secrets.slack-webhook
    pattern-regex: 'https://hooks\\.slack\\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[A-Za-z0-9]+'
    message: >
      Slack webhook URL hardcoded — enables message posting to your channels.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      canop_severity: MEDIUM
      confidence: HIGH
      category: secrets
      cwe: "CWE-798"
      fix: "Use process.env.SLACK_WEBHOOK_URL"

  - id: canop.js-secrets.sendgrid-api-key
    pattern-regex: 'SG\\.[A-Za-z0-9_\\-]{22}\\.[A-Za-z0-9_\\-]{43}'
    message: >
      SendGrid API key detected — enables email sending on your behalf.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      canop_severity: CRITICAL
      confidence: HIGH
      category: secrets
      cwe: "CWE-798"
      fix: "Use process.env.SENDGRID_API_KEY"

  - id: canop.js-secrets.twilio-api-key
    pattern-regex: 'SK[a-f0-9]{32}'
    message: >
      Potential Twilio API key detected in code.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      canop_severity: HIGH
      confidence: MEDIUM
      category: secrets
      cwe: "CWE-798"
      fix: "Use environment variable for Twilio credentials"

  - id: canop.js-secrets.firebase-config
    pattern-regex: 'apiKey\s*:\s*[''"]AIza[A-Za-z0-9_\\-]{35}[''"]'
    message: >
      Firebase API key in code. While client-side Firebase keys are semi-public,
      verify Firestore security rules are properly configured.
    severity: INFO
    languages: [javascript, typescript]
    metadata:
      canop_severity: LOW
      confidence: HIGH
      category: secrets
      cwe: "CWE-798"
      fix: "Use environment variables; ensure Firestore security rules are configured"

  - id: canop.js-secrets.private-key-pem
    pattern-regex: '-----BEGIN (?:RSA |EC |DSA )?PRIVATE KEY-----'
    message: >
      Private key embedded in code. Private keys must never be in source code.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      canop_severity: CRITICAL
      confidence: HIGH
      category: secrets
      cwe: "CWE-321"
      fix: "Store private keys in secure vault or as file reference via env var"

  - id: canop.js-secrets.database-url-password
    pattern-regex: '(?:mongodb|mysql|postgres|redis)://[^:]+:[^@]+@'
    message: >
      Database connection string with embedded password detected.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      canop_severity: CRITICAL
      confidence: HIGH
      category: secrets
      cwe: "CWE-798"
      fix: "Use process.env.DATABASE_URL"

  - id: canop.js-secrets.heroku-api-key
    pattern-regex: '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
    message: >
      Potential Heroku API key or UUID with credentials detected. Verify context.
    severity: INFO
    languages: [javascript, typescript]
    metadata:
      canop_severity: LOW
      confidence: LOW
      category: secrets
      cwe: "CWE-798"
      fix: "If this is a credential, use environment variables"

  - id: canop.js-secrets.mailgun-api-key
    pattern-regex: 'key-[A-Za-z0-9]{32}'
    message: >
      Potential Mailgun API key detected in code.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      canop_severity: HIGH
      confidence: MEDIUM
      category: secrets
      cwe: "CWE-798"
      fix: "Use process.env.MAILGUN_API_KEY"

  - id: canop.js-secrets.jwt-hardcoded-secret
    pattern-regex: '(?:jwt|jsonwebtoken).*(?:sign|verify)\s*\([^)]*[''"][A-Za-z0-9+/=]{8,}[''"]'
    message: >
      Hardcoded JWT secret in code. Compromised secrets allow token forgery.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      canop_severity: CRITICAL
      confidence: MEDIUM
      category: secrets
      cwe: "CWE-798"
      fix: "Use process.env.JWT_SECRET with a strong random value"

  - id: canop.js-secrets.openai-api-key
    pattern-regex: 'sk-[A-Za-z0-9]{20}T3BlbkFJ[A-Za-z0-9]{20}'
    message: >
      OpenAI API key detected — enables LLM API usage billed to your account.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      canop_severity: CRITICAL
      confidence: HIGH
      category: secrets
      cwe: "CWE-798"
      fix: "Use process.env.OPENAI_API_KEY"

  - id: canop.js-secrets.npm-token
    pattern-regex: '//registry\\.npmjs\\.org/:_authToken=[A-Za-z0-9-]+'
    message: >
      npm registry auth token detected — enables publishing packages.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      canop_severity: CRITICAL
      confidence: HIGH
      category: secrets
      cwe: "CWE-798"
      fix: "Use NPM_TOKEN env variable; add .npmrc to .gitignore"

  - id: canop.js-secrets.password-assignment
    pattern-regex: '(?:password|passwd|pwd)\s*[=:]\s*[''"][^''"]{3,}[''"]'
    message: >
      Hardcoded password detected. Never store passwords in source code.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      canop_severity: HIGH
      confidence: MEDIUM
      category: secrets
      cwe: "CWE-798"
      fix: "Use environment variables or a secrets manager"
