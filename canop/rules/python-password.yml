rules:
  # ── Password hashing ──────────────────────────────────────────────────
  - id: canop.python-password.hashlib-for-password
    pattern-regex: 'hashlib\.(?:md5|sha1|sha256|sha512)\s*\(.*(?:password|passwd)'
    message: >
      Hashing password with hashlib. Use bcrypt, argon2, or scrypt —
      plain hashes are vulnerable to rainbow table attacks.
    severity: ERROR
    languages: [python]
    metadata:
      canop_severity: HIGH
      confidence: HIGH
      category: crypto
      cwe: "CWE-916"
      fix: "Use bcrypt.hashpw() or argon2.PasswordHasher().hash(password)"
      prescription:
        task: "Replace hashlib password hashing with bcrypt"
        fix_strategy: "Use bcrypt which includes automatic salting and key stretching"
        fix_patterns:
          python: "import bcrypt\nhashed = bcrypt.hashpw(password.encode(), bcrypt.gensalt())\nbcrypt.checkpw(password.encode(), hashed)"
        constraints:
          - "Never use MD5, SHA1, or SHA256 alone for passwords"
          - "bcrypt, argon2, or scrypt include built-in salting"
          - "Use a cost factor of at least 12 for bcrypt"
        test_after: "Verify passwords are stored as bcrypt hashes ($2b$ prefix)"

  - id: canop.python-password.no-salt
    pattern-regex: 'hashlib\.\w+\s*\(\s*(?:password|passwd|secret)'
    message: >
      Password hashed without salt. Identical passwords produce identical
      hashes, enabling rainbow table attacks.
    severity: ERROR
    languages: [python]
    metadata:
      canop_severity: HIGH
      confidence: MEDIUM
      category: crypto
      cwe: "CWE-759"
      fix: "Use bcrypt (automatic salting) or hashlib.pbkdf2_hmac() with os.urandom(32)"

  - id: canop.python-password.low-iteration-pbkdf2
    pattern-regex: 'pbkdf2_hmac\s*\(.*iterations\s*=\s*(\d+)'
    message: >
      Check PBKDF2 iteration count. OWASP recommends at least 600,000
      for SHA-256 (2023 guidance).
    severity: WARNING
    languages: [python]
    metadata:
      canop_severity: MEDIUM
      confidence: LOW
      category: crypto
      cwe: "CWE-916"
      fix: "Use iterations=600000 or higher for PBKDF2-SHA256"

  # ── Token generation ──────────────────────────────────────────────────
  - id: canop.python-password.uuid-as-token
    pattern-regex: '(?i)(?:token|session_id|reset_token|api_key)\s*=\s*(?:str\()?uuid\.uuid[14]\(\)'
    message: >
      UUID used as security token. UUID1 contains MAC address; UUID4 is
      random but only 122 bits. Use secrets.token_urlsafe(32).
    severity: WARNING
    languages: [python]
    metadata:
      canop_severity: MEDIUM
      confidence: MEDIUM
      category: crypto
      cwe: "CWE-330"
      fix: "Use secrets.token_urlsafe(32) for 256-bit random tokens"

  - id: canop.python-password.short-token
    pattern-regex: 'secrets\.token_(?:hex|urlsafe|bytes)\s*\(\s*(\d)\s*\)'
    message: >
      Security token with very short length. Use at least 32 bytes.
    severity: WARNING
    languages: [python]
    metadata:
      canop_severity: MEDIUM
      confidence: MEDIUM
      category: crypto
      cwe: "CWE-330"
      fix: "Use secrets.token_urlsafe(32) for sufficient entropy"

  # ── Password comparison ───────────────────────────────────────────────
  - id: canop.python-password.string-compare-hash
    pattern-regex: '(?i)(?:hashed|hash|digest)\s*==\s*'
    message: >
      String comparison of hash/digest. Vulnerable to timing attacks.
      Use hmac.compare_digest().
    severity: WARNING
    languages: [python]
    metadata:
      canop_severity: MEDIUM
      confidence: MEDIUM
      category: timing-attack
      cwe: "CWE-208"
      fix: "Use hmac.compare_digest(hash_a, hash_b)"

  # ── Plaintext password storage ─────────────────────────────────────────
  - id: canop.python-password.store-plaintext
    pattern-regex: '(?i)(?:user|account)\.password\s*=\s*(?:password|passwd|request\.\w+)'
    message: >
      Password stored in plaintext. Always hash before storing.
    severity: ERROR
    languages: [python]
    metadata:
      canop_severity: CRITICAL
      confidence: MEDIUM
      category: crypto
      cwe: "CWE-256"
      fix: "Hash with bcrypt: user.password = bcrypt.hashpw(password, bcrypt.gensalt())"

  - id: canop.python-password.password-in-log
    pattern-regex: '(?i)(?:log|print|debug|info|warn|error)\s*\(.*(?:password|passwd)\s*(?:=|:)'
    message: >
      Password potentially logged. Never log credentials.
    severity: WARNING
    languages: [python]
    metadata:
      canop_severity: HIGH
      confidence: MEDIUM
      category: information-exposure
      cwe: "CWE-532"
      fix: "Remove password from log statement"

  # ── JWT best practices ────────────────────────────────────────────────
  - id: canop.python-password.jwt-no-expiry
    patterns:
      - pattern: jwt.encode($PAYLOAD, ...)
      - pattern-not-inside: |
          $PAYLOAD = {..., "exp": ..., ...}
          ...
          jwt.encode($PAYLOAD, ...)
    message: >
      JWT created without expiration claim. Tokens should expire.
    severity: WARNING
    languages: [python]
    metadata:
      canop_severity: MEDIUM
      confidence: LOW
      category: auth
      cwe: "CWE-613"
      fix: "Add 'exp' claim: payload['exp'] = datetime.utcnow() + timedelta(hours=1)"

  - id: canop.python-password.jwt-hs256-weak-key
    pattern-regex: 'jwt\.encode\s*\(.*["\x27](?:secret|password|key|changeme|test|demo)["\x27]'
    message: >
      JWT signed with a weak secret. Use a random 256-bit key.
    severity: WARNING
    languages: [python]
    metadata:
      canop_severity: HIGH
      confidence: MEDIUM
      category: crypto
      cwe: "CWE-326"
      fix: "Generate key with: openssl rand -hex 32"
