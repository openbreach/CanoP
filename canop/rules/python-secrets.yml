rules:
  # ── Hardcoded passwords ────────────────────────────────────────────────
  - id: canop.python-secrets.hardcoded-password
    patterns:
      - pattern: $VAR = "..."
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)(password|passwd|secret|api_key|apikey|access_token|private_key|auth_token|secret_key)
      - pattern-not: $VAR = ""
    message: >
      Potential hardcoded credential. Move secrets to environment variables
      or a secret manager.
    severity: WARNING
    languages: [python]
    metadata:
      canop_severity: HIGH
      confidence: MEDIUM
      category: secrets
      cwe: "CWE-798"
      fix: "Use os.environ['SECRET_NAME'] and store in .env (git-ignored)"

  # ── Hardcoded connection strings ───────────────────────────────────────
  - id: canop.python-secrets.hardcoded-db-url
    patterns:
      - pattern: $VAR = "postgresql://..."
    message: >
      Database connection string hardcoded. May contain credentials.
    severity: WARNING
    languages: [python]
    metadata:
      canop_severity: HIGH
      confidence: HIGH
      category: secrets
      cwe: "CWE-798"
      fix: "Use os.environ['DATABASE_URL'] and store in .env"

  - id: canop.python-secrets.hardcoded-mysql-url
    patterns:
      - pattern: $VAR = "mysql://..."
    message: >
      MySQL connection string hardcoded. May contain credentials.
    severity: WARNING
    languages: [python]
    metadata:
      canop_severity: HIGH
      confidence: HIGH
      category: secrets
      cwe: "CWE-798"
      fix: "Use os.environ['DATABASE_URL']"

  - id: canop.python-secrets.hardcoded-mongodb-url
    patterns:
      - pattern: $VAR = "mongodb://..."
    message: >
      MongoDB connection string hardcoded. May contain credentials.
    severity: WARNING
    languages: [python]
    metadata:
      canop_severity: HIGH
      confidence: HIGH
      category: secrets
      cwe: "CWE-798"
      fix: "Use os.environ['MONGODB_URL']"

  - id: canop.python-secrets.hardcoded-redis-url
    patterns:
      - pattern: $VAR = "redis://..."
    message: >
      Redis URL hardcoded. May contain password.
    severity: WARNING
    languages: [python]
    metadata:
      canop_severity: MEDIUM
      confidence: MEDIUM
      category: secrets
      cwe: "CWE-798"
      fix: "Use os.environ['REDIS_URL']"

  # ── GCP service account ────────────────────────────────────────────────
  - id: canop.python-secrets.gcp-service-account-inline
    pattern: |
      $CREDS = {
          ...,
          "type": "service_account",
          ...
      }
    message: >
      GCP service account JSON key inline. This grants cloud access.
    severity: ERROR
    languages: [python]
    metadata:
      canop_severity: CRITICAL
      confidence: HIGH
      category: secrets
      cwe: "CWE-798"
      fix: "Use Workload Identity Federation or GOOGLE_APPLICATION_CREDENTIALS env var"
