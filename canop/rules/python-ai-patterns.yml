rules:
  # ── AI Model Loading ───────────────────────────────────────────────────
  - id: canop.python-ai.torch-load-untrusted
    patterns:
      - pattern: torch.load(...)
      - pattern-not: torch.load(..., weights_only=True, ...)
    message: >
      torch.load() uses pickle internally. Loading untrusted model files
      can execute arbitrary code.
    severity: ERROR
    languages: [python]
    metadata:
      canop_severity: HIGH
      confidence: HIGH
      category: ai-security
      cwe: "CWE-502"
      fix: "Use torch.load(path, weights_only=True) or safetensors.torch.load_file()"

  - id: canop.python-ai.transformers-trust-remote
    pattern: $MODEL.from_pretrained(..., trust_remote_code=True, ...)
    message: >
      trust_remote_code=True allows the model repo to execute arbitrary Python
      code during loading. Only use with trusted model sources.
    severity: WARNING
    languages: [python]
    metadata:
      canop_severity: HIGH
      confidence: HIGH
      category: ai-security
      cwe: "CWE-94"
      fix: "Remove trust_remote_code=True unless you've audited the model's custom code"

  # ── LangChain dangerous tools ──────────────────────────────────────────
  - id: canop.python-ai.langchain-shell-tool
    patterns:
      - pattern-either:
          - pattern: ShellTool()
          - pattern: BashProcess()
    message: >
      LangChain ShellTool/BashProcess gives the LLM direct shell access.
      A prompt injection attack could execute arbitrary commands.
    severity: ERROR
    languages: [python]
    metadata:
      canop_severity: CRITICAL
      confidence: HIGH
      category: ai-security
      cwe: "CWE-78"
      fix: "Remove shell tools from LLM agent. Use structured tools with strict input validation."

  - id: canop.python-ai.langchain-python-repl
    patterns:
      - pattern-either:
          - pattern: PythonREPLTool()
          - pattern: PythonREPL()
    message: >
      LangChain PythonREPL gives the LLM arbitrary Python execution.
      Prompt injection can lead to full system compromise.
    severity: ERROR
    languages: [python]
    metadata:
      canop_severity: CRITICAL
      confidence: HIGH
      category: ai-security
      cwe: "CWE-95"
      fix: "Use a sandboxed execution environment or structured tools with validation"

  - id: canop.python-ai.langchain-sqltool
    pattern: SQLDatabaseToolkit(...)
    message: >
      LangChain SQL tool gives the LLM direct database access.
      Prompt injection can lead to data exfiltration or manipulation.
    severity: WARNING
    languages: [python]
    metadata:
      canop_severity: HIGH
      confidence: MEDIUM
      category: ai-security
      cwe: "CWE-89"
      fix: "Use read-only database connections and restrict to specific tables"

  # ── Unsafe eval of LLM output ─────────────────────────────────────────
  - id: canop.python-ai.eval-llm-output
    pattern: |
      $RESULT = $LLM.invoke(...)
      ...
      eval($RESULT)
    message: >
      Evaluating LLM output with eval() — LLM outputs are untrusted and
      can contain malicious code via prompt injection.
    severity: ERROR
    languages: [python]
    metadata:
      canop_severity: CRITICAL
      confidence: MEDIUM
      category: ai-security
      cwe: "CWE-95"
      fix: "Never eval() LLM output. Parse with json.loads() or ast.literal_eval()"

  - id: canop.python-ai.exec-llm-output
    pattern: |
      $RESULT = $LLM.invoke(...)
      ...
      exec($RESULT)
    message: >
      Executing LLM output with exec() — LLM outputs are untrusted.
    severity: ERROR
    languages: [python]
    metadata:
      canop_severity: CRITICAL
      confidence: MEDIUM
      category: ai-security
      cwe: "CWE-95"
      fix: "Never exec() LLM output. Use structured parsing instead."

  # ── Insecure temp file for model data ──────────────────────────────────
  - id: canop.python-ai.tempfile-mktemp
    pattern: tempfile.mktemp(...)
    message: >
      tempfile.mktemp() is insecure — creates a race condition.
    severity: WARNING
    languages: [python]
    metadata:
      canop_severity: MEDIUM
      confidence: HIGH
      category: configuration
      cwe: "CWE-377"
      fix: "Use tempfile.mkstemp() or tempfile.NamedTemporaryFile(delete=False)"

  # ── Numpy/Pandas load without validation ───────────────────────────────
  - id: canop.python-ai.numpy-load-allow-pickle
    pattern: numpy.load(..., allow_pickle=True, ...)
    message: >
      numpy.load() with allow_pickle=True enables arbitrary code execution.
    severity: ERROR
    languages: [python]
    metadata:
      canop_severity: HIGH
      confidence: HIGH
      category: deserialization
      cwe: "CWE-502"
      fix: "Use allow_pickle=False (default since NumPy 1.16.3)"

  - id: canop.python-ai.np-load-allow-pickle
    pattern: np.load(..., allow_pickle=True, ...)
    message: >
      np.load() with allow_pickle=True enables arbitrary code execution.
    severity: ERROR
    languages: [python]
    metadata:
      canop_severity: HIGH
      confidence: HIGH
      category: deserialization
      cwe: "CWE-502"
      fix: "Use allow_pickle=False"

  # ── Pandas read_pickle ─────────────────────────────────────────────────
  - id: canop.python-ai.pandas-read-pickle
    pattern: pd.read_pickle(...)
    message: >
      pandas.read_pickle() uses pickle internally — arbitrary code execution
      from untrusted files.
    severity: ERROR
    languages: [python]
    metadata:
      canop_severity: HIGH
      confidence: HIGH
      category: deserialization
      cwe: "CWE-502"
      fix: "Use pd.read_csv(), pd.read_parquet(), or pd.read_json() instead"

  - id: canop.python-ai.pandas-read-pickle-full
    pattern: pandas.read_pickle(...)
    message: >
      pandas.read_pickle() uses pickle internally — arbitrary code execution.
    severity: ERROR
    languages: [python]
    metadata:
      canop_severity: HIGH
      confidence: HIGH
      category: deserialization
      cwe: "CWE-502"
      fix: "Use pandas.read_parquet() or pandas.read_json() for safe data loading"

  # ── joblib load ────────────────────────────────────────────────────────
  - id: canop.python-ai.joblib-load
    pattern: joblib.load(...)
    message: >
      joblib.load() uses pickle internally — arbitrary code execution from
      untrusted files. Common in scikit-learn model loading.
    severity: ERROR
    languages: [python]
    metadata:
      canop_severity: HIGH
      confidence: HIGH
      category: deserialization
      cwe: "CWE-502"
      fix: "Use ONNX or safetensors format for model interchange"

  # ── sklearn model loading ──────────────────────────────────────────────
  - id: canop.python-ai.sklearn-pickle-load
    pattern: |
      $MODEL = pickle.load($FILE)
      ...
      $MODEL.predict(...)
    message: >
      ML model loaded from pickle — the model file could contain arbitrary
      code that executes on load.
    severity: ERROR
    languages: [python]
    metadata:
      canop_severity: HIGH
      confidence: MEDIUM
      category: deserialization
      cwe: "CWE-502"
      fix: "Use ONNX or skl2onnx for safe model interchange"

  # ── Prompt injection via string formatting ─────────────────────────────
  - id: canop.python-ai.prompt-injection-fstring
    pattern: |
      $PROMPT = f"...{$USER_INPUT}..."
      ...
      $LLM.invoke($PROMPT)
    message: >
      User input directly in LLM prompt via f-string — prompt injection risk.
      User can override system instructions.
    severity: WARNING
    languages: [python]
    metadata:
      canop_severity: MEDIUM
      confidence: LOW
      category: ai-security
      cwe: "CWE-74"
      fix: "Use structured prompt templates with clear user/system message boundaries"

  # ── OpenAI / Anthropic direct key ──────────────────────────────────────
  - id: canop.python-ai.openai-hardcoded-key
    pattern: openai.api_key = "..."
    message: >
      OpenAI API key hardcoded. Store in environment variable.
    severity: ERROR
    languages: [python]
    metadata:
      canop_severity: HIGH
      confidence: HIGH
      category: secrets
      cwe: "CWE-798"
      fix: "Use openai.api_key = os.environ['OPENAI_API_KEY']"

  - id: canop.python-ai.openai-client-hardcoded
    pattern: OpenAI(api_key="...")
    message: >
      OpenAI client initialized with hardcoded API key.
    severity: ERROR
    languages: [python]
    metadata:
      canop_severity: HIGH
      confidence: HIGH
      category: secrets
      cwe: "CWE-798"
      fix: "Use OpenAI() which reads from OPENAI_API_KEY env var automatically"

  - id: canop.python-ai.anthropic-client-hardcoded
    pattern: Anthropic(api_key="...")
    message: >
      Anthropic client initialized with hardcoded API key.
    severity: ERROR
    languages: [python]
    metadata:
      canop_severity: HIGH
      confidence: HIGH
      category: secrets
      cwe: "CWE-798"
      fix: "Use Anthropic() which reads from ANTHROPIC_API_KEY env var automatically"

  # ── Hugging Face Hub token ─────────────────────────────────────────────
  - id: canop.python-ai.hf-login-hardcoded
    pattern: huggingface_hub.login(token="...")
    message: >
      Hugging Face token hardcoded. Store in environment variable.
    severity: ERROR
    languages: [python]
    metadata:
      canop_severity: HIGH
      confidence: HIGH
      category: secrets
      cwe: "CWE-798"
      fix: "Use huggingface_hub.login(token=os.environ['HF_TOKEN'])"
